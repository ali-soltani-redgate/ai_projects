name: Build Customer Profiler API

on:
    push:
        branches: [main]
        paths:
            - "customer_profiler/api/**"
    pull_request:
        branches: [main]
        paths:
            - "customer_profiler/api/**"

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: customer_profiler/api
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up uv
              uses: astral-sh/setup-uv@v4
              with:
                version: "latest"
            - name: Install dependencies
              run: uv sync --no-dev
            - name: Verify app imports
              run: |
                uv run python -c "from customer_profiler.api.main import app; print(f'FastAPI app: {app.title}')"
